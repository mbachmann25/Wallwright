name: Verify agent instruction synchronization

on:
  push:
  pull_request:

jobs:
  verify-agent-instructions:
    name: Verify generated agent instructions
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify agent instruction files are synchronized
        shell: pwsh
        run: ./scripts/sync-agent-instructions.ps1 -Check
